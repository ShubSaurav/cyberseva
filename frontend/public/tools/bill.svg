<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Card Background -->
  <g transform="rotate(-4 256 256)">
    <rect x="70" y="56" width="372" height="400" rx="32" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="4" filter="url(#cardShadow)" />
    
    <!-- Header Banner -->
    <path d="M 72 88 Q 72 58 102 58 L 410 58 Q 440 58 440 88 L 440 130 L 72 130 Z" fill="url(#blueHeader)" />
    <text x="100" y="102" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF" letter-spacing="1">ELECTRICITY BILL</text>
    <text x="100" y="120" font-family="Arial, sans-serif" font-weight="700" font-size="13" fill="#BAE6FD">UPPCL / STATE POWER CORP</text>

    <!-- Lightning Icon Badge -->
    <circle cx="390" cy="94" r="26" fill="url(#goldGrad)" />
    <path d="M 392 78 L 378 96 L 390 96 L 386 112 L 402 92 L 390 92 Z" fill="#FFFFFF" />

    <!-- Bill Content Lines -->
    <rect x="100" y="160" width="160" height="12" rx="6" fill="#94A3B8" />
    <rect x="100" y="185" width="220" height="10" rx="5" fill="#CBD5E1" />
    <rect x="100" y="205" width="190" height="10" rx="5" fill="#CBD5E1" />

    <!-- Meter Reading Box -->
    <rect x="100" y="240" width="312" height="60" rx="14" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="2" />
    <text x="116" y="265" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#64748B">CONSUMER NO: 10928374</text>
    <text x="116" y="285" font-family="Arial, sans-serif" font-size="15" font-weight="900" fill="#0F172A">UNITS CONSUMED: 142 kWh</text>

    <!-- Amount Due Banner -->
    <rect x="100" y="320" width="312" height="70" rx="16" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2" />
    <text x="120" y="348" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857">TOTAL BILL AMOUNT</text>
    <text x="120" y="375" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#065F46">₹ 840.00</text>

    <!-- PAID Stamp -->
    <g transform="translate(310, 325) rotate(-12)">
      <rect x="0" y="0" width="90" height="34" rx="8" fill="#10B981" />
      <text x="45" y="23" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" text-anchor="middle">✓ PAID</text>
    </g>

    <!-- Barcode Strip -->
    <g transform="translate(100, 410)">
      <rect x="0" y="0" width="4" height="26" fill="#0F172A" />
      <rect x="8" y="0" width="2" height="26" fill="#0F172A" />
      <rect x="14" y="0" width="6" height="26" fill="#0F172A" />
      <rect x="24" y="0" width="3" height="26" fill="#0F172A" />
      <rect x="32" y="0" width="8" height="26" fill="#0F172A" />
      <rect x="44" y="0" width="4" height="26" fill="#0F172A" />
      <rect x="52" y="0" width="6" height="26" fill="#0F172A" />
      <rect x="62" y="0" width="2" height="26" fill="#0F172A" />
      <rect x="68" y="0" width="5" height="26" fill="#0F172A" />
      <rect x="78" y="0" width="8" height="26" fill="#0F172A" />
      <rect x="90" y="0" width="3" height="26" fill="#0F172A" />
      <rect x="98" y="0" width="7" height="26" fill="#0F172A" />
      <rect x="110" y="0" width="4" height="26" fill="#0F172A" />
      <rect x="118" y="0" width="2" height="26" fill="#0F172A" />
      <rect x="124" y="0" width="6" height="26" fill="#0F172A" />
      <rect x="134" y="0" width="5" height="26" fill="#0F172A" />
      <rect x="144" y="0" width="3" height="26" fill="#0F172A" />
      <rect x="152" y="0" width="8" height="26" fill="#0F172A" />
      <rect x="165" y="0" width="4" height="26" fill="#0F172A" />
      <rect x="174" y="0" width="2" height="26" fill="#0F172A" />
      <rect x="180" y="0" width="7" height="26" fill="#0F172A" />
    </g>
  </g>
</svg>
